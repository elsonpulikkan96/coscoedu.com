name: Deploy to Staging

on:
  push:
    branches: [staging]

env:
  IMAGE_NAME: elsonpulikkan/cosco-overseas-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from Git SHA
        run: echo "IMAGE_TAG=staging-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          script: |
            sudo docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            sudo docker stop cosco-frontend-staging || true
            sudo docker rm cosco-frontend-staging || true
            sudo docker run -d \
              --name cosco-frontend-staging \
              --restart unless-stopped \
              -p 127.0.0.1:3001:80 \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            sudo docker image prune -f
